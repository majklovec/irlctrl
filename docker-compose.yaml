services:
    # Local secrets (CONTROL_SERVER_TOKEN, OBS_PASSWORD, ...) live in .env
    # (gitignored). See .env.example for the variable list.
    server:
        build:
            context: .
            dockerfile: Dockerfile
        image: majkl/belabox-duo-control:latest
        container_name: belabox-server
        restart: unless-stopped
        user: "1000:1000"
        command:
            - "--db"
            - "/config/users.db"
        volumes:
            - ./config/server:/config
        ports:
            - "8090:8090"
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "-e",
                    "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 5

    obs-client:
        image: majkl/belabox-duo-control:latest
        container_name: belabox-obs-client
        restart: unless-stopped
        entrypoint:
            [
                "bun",
                "backend/obs-client/obs-client.ts",
                "--config",
                "/config/config.json",
            ]
        volumes:
            - ./config/obs-client:/config
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - CONTROL_SERVER_URL=${CONTROL_SERVER_URL}
            - CONTROL_SERVER_TOKEN=${CONTROL_SERVER_TOKEN}
            - OBS_URL=${OBS_URL}
            - OBS_PASSWORD=${OBS_PASSWORD}
        depends_on:
            server:
                condition: service_healthy

    relay:
        build:
            context: .
            dockerfile: Dockerfile.device
        image: majkl/belabox-duo-device:latest
        container_name: belabox-relay
        restart: unless-stopped
        cap_add:
            - NET_ADMIN
        ports:
            - "8086:8085"
        command:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8085"
            - "--role"
            - "relay"
            - "--pipelines"
            - "/app/pipeline"
            - "--config"
            - "/config/config.json"
        volumes:
            - ./config/relay:/config
            # Bind-mount the pipeline definitions so the app (uid 1000 in the
            # encoder) can create directories and files at runtime and edits
            # survive image rebuilds. The image's baked-in /app/pipeline is
            # root:755 and not writable.
            - ./pipeline:/app/pipeline
        environment:
            - CONTROL_SERVER_URL=${CONTROL_SERVER_URL}
            - CONTROL_SERVER_TOKEN=${CONTROL_SERVER_TOKEN}
            - SRTLA_SEND_BIN=/app/srtla_send
        depends_on:
            server:
                condition: service_healthy

    encoder:
        image: majkl/belabox-duo-device:latest
        container_name: belabox-encoder
        restart: unless-stopped
        # Runs as root (like the relay): the ssh module needs root for
        # sshd (port 22, root logins) and chpasswd (password reset).
        ports:
            - "8085:8085"
        command:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8085"
            - "--role"
            - "encoder"
            - "--pipelines"
            - "/app/pipeline"
            - "--config"
            - "/config/config.json"
            - "--ceracoder-conf"
            - "/config/ceracoder.conf"
        volumes:
            - ./config/encoder:/config
            # Bind-mount the pipeline definitions so the app (uid 1000) can
            # create directories and files at runtime and edits survive image
            # rebuilds. The image's baked-in /app/pipeline is root:755 and not
            # writable.
            - ./pipeline:/app/pipeline
        environment:
            - CONTROL_SERVER_URL=${CONTROL_SERVER_URL}
            - CONTROL_SERVER_TOKEN=${CONTROL_SERVER_TOKEN}
            - ENCODER_BIN=/app/ceracoder
        depends_on:
            server:
                condition: service_healthy
