<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay</title>
  <!--
    Critical layout CSS inlined in the document so it is present at FIRST
    paint. The external overlay.css loads as a separate file; in OBS's
    CEF that arrives after the initial frame and CEF often does not repaint
    on the late CSS, leaving an unstyled (auto-height) document where
    flex-based elements render collapsed/stuck. Inlining these rules at the
    top of <head> guarantees a correct first paint — no need for OBS's
    "Custom CSS" field.
  -->
  <style>
    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
    body {
      background-color: rgba(0, 0, 0, 0);
    }
  </style>
  <link rel="stylesheet" href="../frontend/overlay.css" />
</head>

<body>
  <div id="app"></div>
  <script type="module" src="../frontend/overlay_view.tsx"></script>
</body>

</html>
