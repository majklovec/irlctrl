<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Send to IRL Control</title>
  <!--
    Self-contained sender page: it is opened on a phone (or a second browser)
    to publish a camera / screen feed into a WebRTC overlay element. Its styling
    is inlined so the page has no external CSS dependency — a bare room with a
    couple of big buttons and a local preview.
  -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b0d12;
      color: #e6e8ee;
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #9aa3b2; margin: 0 0 20px; font-size: 14px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    button {
      flex: 1 1 200px;
      padding: 14px 16px;
      font: inherit;
      font-weight: 600;
      color: #0b0d12;
      background: #e6e8ee;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary { background: #2a3140; color: #e6e8ee; }
    .status {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #161b26;
      font-size: 14px;
      min-height: 24px;
    }
    .status.is-live { background: #12251b; color: #7be0a9; }
    .status.is-error { background: #2a1518; color: #f0a0a8; }
    video#preview {
      width: 100%;
      max-width: 100%;
      border-radius: 12px;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <h1>Share to IRL Control</h1>
    <p class="sub">Pick a source to start streaming to the overlay.</p>
    <div class="actions">
      <button id="share-camera" type="button">Share camera</button>
      <button id="share-screen" type="button" class="secondary">
        Share screen
      </button>
      <button id="stop" type="button" class="secondary" disabled>
        Stop
      </button>
    </div>
    <p id="status" class="status">Idle.</p>
    <video id="preview" autoplay muted playsinline></video>
  </main>
  <script type="module" src="../frontend/webrtc_send.tsx"></script>
</body>
</html>
