name: Release

on:
    push:
        branches: [main]
    workflow_dispatch: {}

permissions:
    contents: write
    packages: write

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            new_tag: ${{ steps.semver.outputs.new_tag }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # Installs devDependencies so that the plugins listed in
            # .releaserc.json (e.g. @semantic-release/git) can be resolved.
            - name: Install dependencies
              shell: bash
              run: bun install

            - name: Semantic versioning (semantic-release)
              id: semver
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # Analyzes conventional commits since the last tag and, when a
                  # bump is warranted, publishes the tag + GitHub release directly.
                  npx --yes semantic-release@24

                  # Detect whether this push was released: semantic-release tags HEAD.
                  git fetch --force --tags
                  TAG="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
                  if [ -n "$TAG" ] && [ "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then
                    echo "new_tag=${TAG}" >> "$GITHUB_OUTPUT"
                  fi

    build:
        needs: version
        if: needs.version.outputs.new_tag != ''
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: bun-linux-x64
                      artifact: obs-client-linux-x64
                      client-artifact: client-linux-x64
                      ext: ""
                      native: true
                    - os: ubuntu-latest
                      target: bun-linux-arm64
                      artifact: obs-client-linux-arm64
                      client-artifact: client-linux-arm64
                      ext: ""
                      native: false
                    - os: macos-latest
                      target: bun-darwin-arm64
                      artifact: obs-client-darwin-arm64
                      client-artifact: client-darwin-arm64
                      ext: ""
                      native: true
                    - os: windows-latest
                      target: bun-windows-x64
                      artifact: obs-client-windows-x64
                      client-artifact: client-windows-x64
                      ext: ".exe"
                      native: true

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              shell: bash
              run: bun install

            - name: Generate module manifests
              shell: bash
              run: bun run gen:modules

            # The client embeds the control-server web UI (shared/frontend.ts →
            # generated/frontend-assets.ts); bundle it before the compiled build.
            - name: Generate control-server assets
              shell: bash
              run: bun scripts/gen-control-server-assets.ts

            - name: Build profiling binaries (native only)
              if: matrix.native == true
              shell: bash
              run: |
                  for app in obs-client client; do
                    case $app in
                      client)     ENTRY=./backend/client/client.ts ;;
                      obs-client) ENTRY=./backend/obs-client/obs-client.ts ;;
                    esac
                    bun build --compile --minify --sourcemap \
                      --target=${{ matrix.target }} \
                      ${ENTRY} \
                      --outfile ${app}-prof${{ matrix.ext }}
                  done

            - name: Record bytecode profiles (native only)
              if: matrix.native == true
              shell: bash
              run: |
                  BUN_BYTECODE_ORDER_OUT=obs-client.order ./obs-client-prof${{ matrix.ext }} --help
                  BUN_BYTECODE_ORDER_OUT=client.order ./client-prof${{ matrix.ext }} --help

            - name: Build final binaries
              shell: bash
              run: |
                  for app in obs-client client; do
                    case $app in
                      client)
                        OUTIF=${{ matrix.client-artifact }}
                        ENTRY=./backend/client/client.ts
                        ;;
                      *)
                        OUTIF=${{ matrix.artifact }}
                        ENTRY=./backend/obs-client/obs-client.ts
                        ;;
                    esac

                    ARGS="--compile --minify --sourcemap --format=esm --bytecode \
                      --target=${{ matrix.target }} \
                      ${ENTRY} \
                      --outfile ${OUTIF}${{ matrix.ext }}"

                    if [ -f ${app}.order ]; then
                      ARGS="$ARGS --bytecode-order=${app}.order"
                    fi

                    bun build $ARGS
                  done

            - name: Verify binaries (native only)
              if: matrix.native == true
              shell: bash
              run: |
                  chmod +x ${{ matrix.artifact }}${{ matrix.ext }} ${{ matrix.client-artifact }}${{ matrix.ext }} || true
                  ./${{ matrix.artifact }}${{ matrix.ext }} --help
                  ./${{ matrix.client-artifact }}${{ matrix.ext }} --help

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.target }}
                  path: |
                      ${{ matrix.artifact }}${{ matrix.ext }}
                      ${{ matrix.client-artifact }}${{ matrix.ext }}

    publish-server-docker:
        needs: version
        if: needs.version.outputs.new_tag != ''
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push server image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  tags: |
                      ghcr.io/${{ github.repository }}-server:${{ needs.version.outputs.new_tag }}
                      ghcr.io/${{ github.repository }}-server:latest

    release:
        needs: [version, build, publish-server-docker]
        if: needs.version.outputs.new_tag != ''
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  pattern: bun-*
                  merge-multiple: true

            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.version.outputs.new_tag }}
                  name: Release ${{ needs.version.outputs.new_tag }}
                  # Release body is already set by semantic-release (conventional
                  # commit changelog); this step only attaches the binaries.
                  files: artifacts/*
                  token: ${{ secrets.GITHUB_TOKEN }}
