<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="overlay-template:name" content="overlay.tpl.countdown" />
    <meta name="overlay-template:uses" content="title,vars,mode,targetIso" />
    <style>
		/*
		 * countdown — fills the element's box (no design canvas, no scaling). A big HH:MM:SS under a
		 * label. ;
		 * the doc renderer overrides them.
		 */
		:root {
		    --accent: #6c5ce7;
		    --bg: rgba(15, 15, 25, 0.92);
		    --text: #ffffff;
		    --radius: 12px;
		    --padding: 14px;
		}
		
		*,
		*::before,
		*::after {
		    box-sizing: border-box;
		}
		
		section {
		    position: absolute;
		    inset: 0;
		    width: 100%;
		    height: 100%;
		    background: transparent;
		}
		
		.card {
		    position: absolute;
		    inset: 0;
		    display: flex;
		    flex-direction: column;
		    align-items: center;
		    justify-content: center;
		    gap: 6px;
		    padding: var(--padding);
		    background: var(--bg);
		    border-radius: var(--radius);
		    border-top: 4px solid var(--accent);
		}
		
		.label {
		    color: var(--accent);
		    font-size: 18px;
		    font-weight: 700;
		    letter-spacing: 0.14em;
		    text-transform: uppercase;
		}
		
		.time {
		    color: var(--text);
		    font-size: 64px;
		    font-weight: 800;
		    line-height: 1;
		    font-variant-numeric: tabular-nums;
		}
		
    </style>
  </head>
  <body>
	<section>
	    <div class="card">
	        <div class="label" data-bind="title">Starting in</div>
	        <div class="time" data-countdown data-format="hh:mm:ss">00:00:00</div>
	    </div>
	</section>
	
  </body>
</html>
