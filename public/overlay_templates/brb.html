<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="overlay-template:name" content="overlay.tpl.brb" />
    <style>
      :root {
        --accent: #6c5ce7;
        --bg: rgba(15, 15, 25, 0.96);
        --text: #ffffff;
        --padding: 80px;
        --glow: 0.18;
      }

      *, *::before, *::after { box-sizing: border-box; }

      section {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      .screen {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: var(--padding);
        background: var(--bg);
        overflow: hidden;
      }

      .screen::before,
      .screen::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .screen::before {
        background: radial-gradient(circle at 50% 0%, var(--accent) 0%, transparent 55%);
        opacity: var(--glow);
      }

      .screen::after {
        background: radial-gradient(circle at 50% 100%, var(--accent) 0%, transparent 65%);
        opacity: calc(var(--glow) * 0.5);
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        text-align: center;
      }

      .rule {
        width: 160px;
        height: 6px;
        background: var(--accent);
        border-radius: 3px;
        animation: brb-rule-pulse 3.2s ease-in-out infinite;
      }

      .title {
        color: var(--text);
        font-size: 120px;
        font-weight: 800;
        letter-spacing: 0.02em;
        line-height: 1;
      }

      .subtitle {
        color: var(--text);
        font-size: 44px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.7;
      }

      @keyframes brb-rule-pulse {
        0%, 100% { transform: scaleX(1);    box-shadow: 0 0 24px var(--accent); }
        50%      { transform: scaleX(0.85); box-shadow: 0 0 12px var(--accent); }
      }
    </style>
  </head>
  <body>
    <section>
      <div class="screen">
        <div class="content">
          <div class="rule"></div>
          <div class="title" data-bind="title">Be right back</div>
          <div class="subtitle" data-bind="subtitle">Back in a few</div>
        </div>
      </div>
    </section>
  </body>
</html>
