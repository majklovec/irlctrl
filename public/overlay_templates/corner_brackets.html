<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="overlay-template:name" content="overlay.tpl.corner_brackets" />
    <style>
		:root {
		    --accent: #6c5ce7;
		    --padding: 24px;
		    --corner-glow: rgba(108, 92, 231, 0.4);
		}
		
		*,
		*::before,
		*::after {
		    box-sizing: border-box;
		}
		
		section {
		    position: absolute;
		    top: 0;
		    left: 0;
		    width: 100%;
		    height: 100%;
		    background: transparent;
		}
		
		.corner {
		    position: absolute;
		    width: min(40px, 25%);
		    aspect-ratio: 1;
		    border: 5px solid var(--accent);
		    filter: drop-shadow(0 0 6px var(--corner-glow));
		}
		
		.corner--tl {
		    top: var(--padding);
		    left: var(--padding);
		    border-right: none;
		    border-bottom: none;
		}
		
		.corner--tr {
		    top: var(--padding);
		    right: var(--padding);
		    border-left: none;
		    border-bottom: none;
		}
		
		.corner--bl {
		    bottom: var(--padding);
		    left: var(--padding);
		    border-right: none;
		    border-top: none;
		}
		
		.corner--br {
		    bottom: var(--padding);
		    right: var(--padding);
		    border-left: none;
		    border-top: none;
		}
		
    </style>
  </head>
  <body>
	<section>
	    <div class="corner corner--tl"></div>
	    <div class="corner corner--tr"></div>
	    <div class="corner corner--bl"></div>
	    <div class="corner corner--br"></div>
	</section>
	
  </body>
</html>
