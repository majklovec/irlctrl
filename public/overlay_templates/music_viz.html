<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="overlay-template:name" content="overlay.tpl.music_viz" />
    <style>
      :root {
        --accent: #6c5ce7;
        --bg: rgba(15, 15, 25, 0.92);
        --text: #ffffff;
        --radius: 14px;
        --padding: 18px;
      }

      *, *::before, *::after { box-sizing: border-box; }

      section {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      .card {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: var(--padding);
        background: var(--bg);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 0% 50%, var(--accent) 0%, transparent 55%);
        opacity: 0.16;
        pointer-events: none;
      }

      .viz {
        position: relative;
        flex: none;
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 64px;
        padding: 0 6px;
      }

      .viz span {
        width: 6px;
        background: var(--accent);
        border-radius: 3px;
        box-shadow: 0 0 12px var(--accent);
        animation: viz 1.2s ease-in-out infinite;
      }

      .viz span:nth-child(1)  { height: 30%; animation-delay: -0.10s; }
      .viz span:nth-child(2)  { height: 65%; animation-delay: -0.35s; }
      .viz span:nth-child(3)  { height: 45%; animation-delay: -0.55s; }
      .viz span:nth-child(4)  { height: 90%; animation-delay: -0.20s; }
      .viz span:nth-child(5)  { height: 55%; animation-delay: -0.70s; }
      .viz span:nth-child(6)  { height: 75%; animation-delay: -0.45s; }
      .viz span:nth-child(7)  { height: 35%; animation-delay: -0.85s; }
      .viz span:nth-child(8)  { height: 60%; animation-delay: -0.30s; }
      .viz span:nth-child(9)  { height: 80%; animation-delay: -0.60s; }
      .viz span:nth-child(10) { height: 40%; animation-delay: -0.15s; }

      .info {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }

      .title {
        color: var(--text);
        font-size: 24px;
        font-weight: 800;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .subtitle {
        color: var(--text);
        opacity: 0.7;
        font-size: 15px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      @keyframes viz {
        0%, 100% { transform: scaleY(0.35); }
        50%      { transform: scaleY(1); }
      }
    </style>
  </head>
  <body>
    <section>
      <div class="card">
        <div class="viz">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="info">
          <div class="title" data-bind="title">Now playing</div>
          <div class="subtitle" data-bind="subtitle">Artist — track name</div>
        </div>
      </div>
    </section>
  </body>
</html>
