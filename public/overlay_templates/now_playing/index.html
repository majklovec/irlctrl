<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="overlay-template:name" content="overlay.tpl.now_playing" />
    <style>
		/*
		 * now_playing — fills the element's box (no design canvas, no scaling). A "now playing" chip:
		 * cover art (logo) left, two-line track info right, an accent spine between.
		 * ; the
		 * doc renderer overrides them.
		 */
		:root {
		    --accent: #6c5ce7;
		    --bg: rgba(15, 15, 25, 0.92);
		    --text: #ffffff;
		    --radius: 12px;
		    --padding: 14px;
		}
		
		*,
		*::before,
		*::after {
		    box-sizing: border-box;
		}
		
		section {
		    position: absolute;
		    inset: 0;
		    width: 100%;
		    height: 100%;
		    background: transparent;
		}
		
		.card {
		    position: absolute;
		    inset: 0;
		    display: flex;
		    align-items: center;
		    gap: 16px;
		    padding: var(--padding);
		    background: var(--bg);
		    border-radius: var(--radius);
		    overflow: hidden;
		}
		
		.art {
		    flex: none;
		    position: relative;
		    width: 88px;
		    height: 88px;
		    border-radius: calc(var(--radius) * 0.7);
		    overflow: hidden;
		}
		
		/* Cover art fills the tile; a faint accent block stands in when none is set. */
		.art img {
		    width: 100%;
		    height: 100%;
		    object-fit: cover;
		}
		
		.art-empty {
		    position: absolute;
		    inset: 0;
		    background: var(--accent);
		    opacity: 0.28;
		}
		
		.art:has(img[src]) .art-empty {
		    display: none;
		}
		
		.spine {
		    flex: none;
		    width: 4px;
		    align-self: stretch;
		    background: var(--accent);
		    border-radius: 2px;
		}
		
		.info {
		    display: flex;
		    flex-direction: column;
		    gap: 4px;
		    min-width: 0;
		}
		
		.title {
		    color: var(--text);
		    font-size: 26px;
		    font-weight: 700;
		    line-height: 1.15;
		    white-space: nowrap;
		    overflow: hidden;
		    text-overflow: ellipsis;
		}
		
		.subtitle {
		    color: var(--text);
		    opacity: 0.7;
		    font-size: 18px;
		    line-height: 1.2;
		    white-space: nowrap;
		    overflow: hidden;
		    text-overflow: ellipsis;
		}
		
    </style>
  </head>
  <body>
	<section>
	    <div class="card">
	        <div class="art">
	            <img data-asset="logo" src="data:image/svg+xml,%3Csvg%20xmlns='http%3A//www.w3.org/2000/svg'width='84'%20height='84'%3E%3C/svg%3E"/>
	            <div class="art-empty"></div>
	        </div>
	        <div class="spine"></div>
	        <div class="info">
	            <div class="title" data-bind="title">Track title</div>
	            <div class="subtitle" data-bind="subtitle">Artist</div>
	        </div>
	    </div>
	</section>
	
  </body>
</html>
