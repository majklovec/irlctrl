<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="overlay-template:name" content="overlay.tpl.footer" />
    <style>
		/*
		 * footer — fills the element's box (no design canvas, no scaling). Bottom bar: handle (title)
		 * on the left, secondary text (subtitle) on the right, an accent rule along
		 * the top edge. `:root` declares a fallback for every prop in template.json
		 * `uses`; the doc renderer overrides them.
		 */
		:root {
			--accent: #6c5ce7;
			--bg: rgba(15, 15, 25, 0.92);
			--text: #ffffff;
			--padding: 10px;
		}
		
		*,
		*::before,
		*::after {
			box-sizing: border-box;
		}
		
		section {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
		    background:transparent;
		}
		
		.bar {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 20px;
			padding: 0 var(--padding);
			background: var(--bg);
			border-radius: var(--padding) var(--padding) 0 0;
		}
		
		.rule {
			position: absolute;
			left: var(--padding);
			right: var(--padding);
			top: 0;
			height: 3px;
			background: var(--accent);
		}
		
		.left {
			color: var(--text);
			font-size: 20px;
			font-weight: 700;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		
		.right {
			color: var(--text);
			opacity: 0.72;
			font-size: 16px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		
    </style>
  </head>
  <body>
	<section>
	    <div class="bar">
	        <div class="rule"></div>
	        <span class="left" data-bind="title">@your_handle</span>
	        <span class="right" data-bind="subtitle">{{ secondary_text }}</span>
	    </div>
	</section>
	
  </body>
</html>
