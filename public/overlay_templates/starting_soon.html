<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="overlay-template:name" content="overlay.tpl.starting_soon" />
    <style>
      :root {
        --accent: #6c5ce7;
        --bg: rgba(15, 15, 25, 0.96);
        --text: #ffffff;
        --radius: 24px;
        --logo-glow: rgba(108, 92, 231, 0.5);
      }

      *, *::before, *::after { box-sizing: border-box; }

      section {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: var(--bg);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% -10%, var(--accent) 0%, transparent 55%),
          radial-gradient(circle at 50% 110%, var(--accent) 0%, transparent 60%);
        opacity: 0.2;
        pointer-events: none;
      }

      .logo, .title, .subtitle { position: relative; z-index: 1; }

      .logo {
        width: 140px;
        height: 140px;
        display: grid;
        place-items: center;
      }

      .logo:has(img:not([src])) { display: none; }

      .logo img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0 28px var(--logo-glow));
      }

      .title {
        color: var(--accent);
        font-size: 132px;
        font-weight: 800;
        letter-spacing: 0.02em;
        line-height: 1;
        text-align: center;
        animation: starting-pulse 4s ease-in-out infinite;
      }

      .subtitle {
        color: var(--text);
        font-size: 44px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.82;
        text-align: center;
      }

      @keyframes starting-pulse {
        0%, 100% { text-shadow: 0 0 24px var(--accent); }
        50%      { text-shadow: 0 0 56px var(--accent); }
      }
    </style>
  </head>
  <body>
    <section>
      <div class="screen">
        <span class="logo"><img data-asset="logo" src="data:image/svg+xml,%3Csvg%20xmlns='http%3A//www.w3.org/2000/svg'width='72'%20height='72'%3E%3C/svg%3E"/></span>
        <div class="title" data-bind="title">Starting soon</div>
        <div class="subtitle" data-bind="subtitle">Hang tight</div>
      </div>
    </section>
  </body>
</html>
