<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="name" content="overlay.tpl.chat_box" />
    <style>
      :root {
        --accent: #6c5ce7;
        --bg: rgba(15, 15, 25, 0.9);
        --text: #ffffff;
        --user: #b8a7ff;
        --radius: 14px;
        --padding: 14px;
      }

      *, *::before, *::after { box-sizing: border-box; }

      section {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      .box {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: var(--padding);
        gap: 10px;
        background: var(--bg);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }

      .header .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
        animation: chat-blink 1.6s ease-in-out infinite;
      }

      .header .label {
        color: var(--accent);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .messages {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 16px;
        line-height: 1.3;
      }

      .msg {
        display: flex;
        gap: 8px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .msg .user {
        color: var(--user);
        font-weight: 700;
        flex: none;
      }

      .msg .text {
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
      }

      @keyframes chat-blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.35; }
      }
    </style>
  </head>
  <body>
    <section>
      <div class="box">
        <div class="header">
          <span class="dot"></span>
          <span class="label" data-bind="label">Live chat</span>
        </div>
        <div class="messages">
          <div class="msg"><span class="user" data-bind="user1">alice</span><span class="text" data-bind="line1">hello chat</span></div>
          <div class="msg"><span class="user" data-bind="user2">bob</span><span class="text" data-bind="line2">gg wp</span></div>
          <div class="msg"><span class="user" data-bind="user3">carol</span><span class="text" data-bind="line3">nice play</span></div>
          <div class="msg"><span class="user" data-bind="user4">dave</span><span class="text" data-bind="line4">what song is this?</span></div>
          <div class="msg"><span class="user" data-bind="user5">erin</span><span class="text" data-bind="line5">first time here</span></div>
        </div>
      </div>
    </section>
  </body>
</html>
