<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="overlay-template:name" content="overlay.tpl.goal_bar" />
    <style>
      :root {
        --accent: #6c5ce7;
        --bg: rgba(15, 15, 25, 0.9);
        --text: #ffffff;
        --radius: 12px;
        --padding: 16px;
        --progress: 65%;
      }

      *, *::before, *::after { box-sizing: border-box; }

      section {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      .card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        padding: var(--padding);
        background: var(--bg);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .label {
        color: var(--text);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .value {
        color: var(--accent);
        font-size: 22px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        flex: none;
      }

      .track {
        position: relative;
        width: 100%;
        height: 18px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
      }

      .fill {
        position: relative;
        height: 100%;
        width: var(--progress);
        border-radius: 999px;
        background:
          linear-gradient(90deg, rgba(255,255,255,0.3), rgba(255,255,255,0)),
          var(--accent);
        box-shadow: 0 0 18px var(--accent);
        animation: goal-fill 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
        transform: translateX(-100%);
        animation: goal-shimmer 2.4s ease-in-out infinite;
      }

      @keyframes goal-fill {
        from { width: 0; }
        to   { width: var(--progress); }
      }

      @keyframes goal-shimmer {
        0%   { transform: translateX(-100%); }
        60%  { transform: translateX(100%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body>
    <section>
      <div class="card">
        <div class="head">
          <span class="label" data-bind="title">Sub goal</span>
          <span class="value" data-bind="value">65 / 100</span>
        </div>
        <div class="track"><div class="fill"></div></div>
      </div>
    </section>
  </body>
</html>
