<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="overlay-template:name" content="overlay.tpl.alert" />
    <style>
      :root {
        --accent: #6c5ce7;
        --bg: rgba(15, 15, 25, 0.94);
        --text: #ffffff;
        --radius: 14px;
        --padding: 16px;
      }

      *, *::before, *::after { box-sizing: border-box; }

      section {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      .card {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: var(--padding);
        background: var(--bg);
        border-radius: var(--radius);
        overflow: hidden;
        animation: alert-in 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .accent {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 5px;
        background: var(--accent);
        box-shadow: 0 0 14px var(--accent);
      }

      .icon {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--text);
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 800;
        box-shadow: 0 0 20px var(--accent);
      }

      .content {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        padding-left: 6px;
      }

      .title {
        color: var(--text);
        font-size: 22px;
        font-weight: 700;
        line-height: 1.15;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .subtitle {
        color: var(--text);
        opacity: 0.7;
        font-size: 15px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      @keyframes alert-in {
        from { opacity: 0; transform: translateX(24px); }
        to   { opacity: 1; transform: translateX(0); }
      }
    </style>
  </head>
  <body>
    <section>
      <div class="card">
        <div class="accent"></div>
        <div class="icon">!</div>
        <div class="content">
          <div class="title" data-bind="title">New alert</div>
          <div class="subtitle" data-bind="subtitle">Something happened</div>
        </div>
      </div>
    </section>
  </body>
</html>
