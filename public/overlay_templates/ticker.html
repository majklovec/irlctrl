<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="overlay-template:name" content="overlay.tpl.ticker" />
    <style>
        :root {
            --accent: #6c5ce7;
            --bg: rgba(15, 15, 25, 0.9);
            --text: #ffffff;
            --label-text: #ffffff;
            --padding: 12px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        section {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .bar {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: stretch;
            background: var(--bg);
            overflow: hidden;
        }

        .label {
            flex: none;
            display: flex;
            align-items: center;
            padding: 0 var(--padding);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(0, 0, 0, 0.16)),
                var(--accent);
            color: var(--label-text);
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.16em;
        }

        .viewport {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .viewport::before,
        .viewport::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 60px;
            pointer-events: none;
            z-index: 1;
        }

        .viewport::before {
            left: 0;
            background: linear-gradient(90deg, var(--bg), transparent);
        }

        .viewport::after {
            right: 0;
            background: linear-gradient(270deg, var(--bg), transparent);
        }

        .track {
            position: absolute;
            left: 100%;
            top: 50%;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            animation: ticker-scroll 22s linear infinite;
            will-change: transform;
        }

        .track>span[data-bind="title"] {
            color: var(--text);
            font-size: 22px;
            font-weight: 600;
        }

        .track .sep {
            color: var(--accent);
            font-size: 28px;
            padding: 0 40px;
        }

        @keyframes ticker-scroll {
            from {
                transform: translate(0, -50%);
            }

            to {
                transform: translate(-50%, -50%);
            }
        }
    </style>
</head>

<body>
    <section>
        <div class="bar">
            <span class="label" data-bind="label">LIVE</span>
            <div class="viewport">
                <div class="track">
                    <span data-bind="title">Your scrolling text goes here</span>
                    <span class="sep">•</span>
                    <span data-bind="title">Your scrolling text goes here</span>
                    <span class="sep">•</span>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
