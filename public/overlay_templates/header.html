<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="name" content="overlay.tpl.header" />
    <style>
		/*
		 * header — fills the element's box (no design canvas, no scaling). Top bar: logo + title +
		 * subtitle stacked left, an accent underline along the bottom edge. `:root`
		 * declares a fallback for every prop in template.json `uses`; the doc
		 * renderer overrides them.
		 */
		:root {
			--accent: #6c5ce7;
			--bg: rgba(15, 15, 25, 0.92);
			--text: #ffffff;
			--radius: 12px;
			--padding: 12px;
		}
		
		*,
		*::before,
		*::after {
			box-sizing: border-box;
		}
		
		section {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
		    background:transparent;
		}
		
		.bar {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			gap: 16px;
			padding: var(--padding);
			background: var(--bg);
			border-radius: 0 0 var(--radius) var(--radius);
		}
		
		.logo {
			flex: none;
			width: 52px;
			height: 52px;
			display: grid;
			place-items: center;
		}
		
		/* Empty until a logo asset is set. */
		.logo:has(img:not([src])) {
			display: none;
		}
		
		.logo img {
			max-width: 100%;
			max-height: 100%;
			object-fit: contain;
			border-radius: calc(var(--radius) * 0.6);
		}
		
		.text {
			display: flex;
			flex-direction: column;
			gap: 2px;
			min-width: 0;
		}
		
		.title {
			color: var(--text);
			font-size: 26px;
			font-weight: 700;
			line-height: 1.1;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		
		.subtitle {
			color: var(--text);
			opacity: 0.7;
			font-size: 14px;
			line-height: 1.2;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		
		.underline {
			position: absolute;
			left: var(--padding);
			right: var(--padding);
			bottom: 0;
			height: 4px;
			background: var(--accent);
			border-radius: var(--radius) var(--radius) 0 0;
		}
		
    </style>
  </head>
  <body>
	<section>
	    <div class="bar">
	        <span class="logo"><img data-asset="logo" src="data:image/svg+xml,%3Csvg%20xmlns='http%3A//www.w3.org/2000/svg'width='40'%20height='40'%3E%3C/svg%3E"/></span>
	        <div class="text">
	            <span class="title" data-bind="title">Your stream title</span>
	            <span class="subtitle" data-bind="subtitle">a subtitle line</span>
	        </div>
	        <div class="underline"></div>
	    </div>
	</section>
	
  </body>
</html>
