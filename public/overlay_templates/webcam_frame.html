<!doctype html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="overlay-template:name" content="overlay.tpl.webcam_frame" />
	<style>
		/*
		 * webcam_frame — fills the element's box (no design canvas, no scaling). A webcam source is
		 * layered BEHIND this element, so the center stays transparent and only
		 * the frame is drawn: an accent border, four L-shaped corner brackets,
		 * and an optional badge logo (hidden until a logo asset is set).
		 * `:root` MUST declare a fallback for every prop in template.json `uses`;
		 * the renderer overrides them from the element's (normalized) props.
		 */
		:root {
			--accent: #6c5ce7;
			--radius: 12px;
			--padding: 18px;
			--frame-glow: rgba(108, 92, 231, 0.35);
		}

		*,
		*::before,
		*::after {
			box-sizing: border-box;
		}

		section {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			background: transparent;
		}

		.frame {
			position: absolute;
			top: var(--padding);
			left: var(--padding);
			right: var(--padding);
			bottom: var(--padding);
			border: 3px solid var(--accent);
			border-radius: var(--radius);
			box-shadow: 0 0 14px var(--frame-glow);
		}

		.corner {
			position: absolute;
			width: 28px;
			height: 28px;
			border: 4px solid var(--accent);
		}

		.corner--tl {
			top: var(--padding);
			left: var(--padding);
			border-right: none;
			border-bottom: none;
			border-top-left-radius: var(--radius);
		}

		.corner--tr {
			top: var(--padding);
			right: var(--padding);
			border-left: none;
			border-bottom: none;
			border-top-right-radius: var(--radius);
		}

		.corner--bl {
			bottom: var(--padding);
			left: var(--padding);
			border-right: none;
			border-top: none;
			border-bottom-left-radius: var(--radius);
		}

		.corner--br {
			bottom: var(--padding);
			right: var(--padding);
			border-left: none;
			border-top: none;
			border-bottom-right-radius: var(--radius);
		}
	</style>
</head>

<body>
	<section>
		<div class="frame"></div>
		<div class="corner corner--tl"></div>
		<div class="corner corner--tr"></div>
		<div class="corner corner--bl"></div>
		<div class="corner corner--br"></div>
	</section>

</body>

</html>
