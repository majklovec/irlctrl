<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="overlay-template:name" content="overlay.tpl.starting_soon" />
    <meta name="overlay-template:uses" content="title,subtitle,vars,logoAssetId" />
    <style>
		/*
		 * starting_soon — fills the element's box (no design canvas, no scaling). A full-screen
		 * pre-stream screen: optional logo up top, a big title, a subtitle beneath.
		 * ; the
		 * doc renderer overrides them.
		 */
		:root {
		    --accent: #6c5ce7;
		    --bg: rgba(15, 15, 25, 0.96);
		    --text: #ffffff;
		    --radius: 24px;
		}
		
		*,
		*::before,
		*::after {
		    box-sizing: border-box;
		}
		
		section {
		    position: absolute;
		    inset: 0;
		    width: 100%;
		    height: 100%;
		    background: transparent;
		}
		
		.screen {
		    position: absolute;
		    inset: 0;
		    display: flex;
		    flex-direction: column;
		    align-items: center;
		    justify-content: center;
		    gap: 28px;
		    background: var(--bg);
		    border-radius: var(--radius);
		}
		
		.logo {
		    width: 140px;
		    height: 140px;
		    display: grid;
		    place-items: center;
		}
		
		/* No stray box when a logo asset is not set. */
		.logo:has(img:not([src])) {
		    display: none;
		}
		
		.logo img {
		    max-width: 100%;
		    max-height: 100%;
		    object-fit: contain;
		}
		
		.title {
		    color: var(--accent);
		    font-size: 132px;
		    font-weight: 800;
		    letter-spacing: 0.02em;
		    line-height: 1;
		    text-align: center;
		}
		
		.subtitle {
		    color: var(--text);
		    font-size: 44px;
		    font-weight: 600;
		    letter-spacing: 0.12em;
		    text-transform: uppercase;
		    opacity: 0.82;
		}
		
    </style>
  </head>
  <body>
	<section>
	    <div class="screen">
	        <span class="logo"><img data-asset="logo" src="data:image/svg+xml,%3Csvg%20xmlns='http%3A//www.w3.org/2000/svg'width='72'%20height='72'%3E%3C/svg%3E"/></span>
	        <div class="title" data-bind="title">Starting soon</div>
	        <div class="subtitle" data-bind="subtitle">Hang tight</div>
	    </div>
	</section>
	
  </body>
</html>
