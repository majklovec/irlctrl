<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <!-- Left Dashed Box -->
  <rect x="50" y="75" width="200" height="150" rx="10" fill="#ffffff" stroke="#8E9CB2"
    stroke-width="2" stroke-dasharray="8 6" />
  <text x="150" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
    fill="#333333" text-anchor="middle">REMOTE SERVER</text>
  <text x="150" y="165" font-family="Arial, sans-serif" font-size="14" fill="#666666"
    text-anchor="middle">SRTLA Sender</text>

  <!-- Arrow to Server -->
  <path d="M 250 150 L 330 150" stroke="#7F8C8D" stroke-width="4" fill="none" />
  <polygon points="330,145 345,150 330,155" fill="#7F8C8D" />
  <text x="285" y="140" font-family="Arial, sans-serif" font-size="12" fill="#666666"
    text-anchor="middle">SRTLA</text>

  <!-- Central Encoder Server -->
  <g transform="translate(345, 65)">
    <!-- Server Shadow -->
    <rect x="5" y="5" width="250" height="150" rx="8" fill="#E0E0E0" />
    <!-- Server Chassis -->
    <rect x="0" y="0" width="250" height="150" rx="8" fill="#2C3E50" stroke="#1A252F"
      stroke-width="2" />
    <!-- Front Bezel -->
    <rect x="10" y="10" width="230" height="130" rx="4" fill="#34495E" />
    <!-- Drive Bays -->
    <rect x="20" y="20" width="60" height="20" rx="2" fill="#1A252F" />
    <rect x="20" y="45" width="60" height="20" rx="2" fill="#1A252F" />
    <rect x="20" y="70" width="60" height="20" rx="2" fill="#1A252F" />
    <rect x="20" y="95" width="60" height="20" rx="2" fill="#1A252F" />
    <!-- Status LEDs -->
    <circle cx="100" cy="30" r="4" fill="#2ECC71" />
    <circle cx="115" cy="30" r="4" fill="#3498DB" />
    <circle cx="130" cy="30" r="4" fill="#F1C40F" />
    <!-- Ventilation Grille -->
    <rect x="100" y="50" width="120" height="70" rx="2" fill="#1A252F" />
    <line x1="110" y1="55" x2="110" y2="115" stroke="#2C3E50" stroke-width="2" />
    <line x1="120" y1="55" x2="120" y2="115" stroke="#2C3E50" stroke-width="2" />
    <line x1="130" y1="55" x2="130" y2="115" stroke="#2C3E50" stroke-width="2" />
    <line x1="140" y1="55" x2="140" y2="115" stroke="#2C3E50" stroke-width="2" />
    <line x1="150" y1="55" x2="150" y2="115" stroke="#2C3E50" stroke-width="2" />
    <line x1="160" y1="55" x2="160" y2="115" stroke="#2C3E50" stroke-width="2" />
    <line x1="170" y1="55" x2="170" y2="115" stroke="#2C3E50" stroke-width="2" />
    <line x1="180" y1="55" x2="180" y2="115" stroke="#2C3E50" stroke-width="2" />
    <line x1="190" y1="55" x2="190" y2="115" stroke="#2C3E50" stroke-width="2" />
    <line x1="200" y1="55" x2="200" y2="115" stroke="#2C3E50" stroke-width="2" />
    <!-- Power Button -->
    <circle cx="220" cy="130" r="8" fill="#E74C3C" />
  </g>

  <!-- Arrows to Platforms -->
  <path d="M 595 110 C 650 110, 680 70, 740 70" stroke="#7F8C8D" stroke-width="3" fill="none" />
  <polygon points="735,65 750,70 735,75" fill="#7F8C8D" />

  <path d="M 595 150 L 740 135" stroke="#7F8C8D" stroke-width="3" fill="none" />
  <polygon points="735,130 750,135 735,140" fill="#7F8C8D" />

  <path d="M 595 190 C 650 190, 680 200, 740 200" stroke="#7F8C8D" stroke-width="3" fill="none" />
  <polygon points="735,195 750,200 735,205" fill="#7F8C8D" />

  <text x="660" y="100" font-family="Arial, sans-serif" font-size="12" fill="#666666"
    text-anchor="middle">RTMP / HLS</text>

  <!-- Right Platform Boxes -->
  <rect x="750" y="50" width="120" height="40" rx="6" fill="#2C3E50" />
  <text x="810" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
    fill="#53FC18" text-anchor="middle">KICK</text>

  <rect x="750" y="115" width="120" height="40" rx="6" fill="#2C3E50" />
  <text x="810" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
    fill="#FF0000" text-anchor="middle">YOUTUBE</text>

  <rect x="750" y="180" width="120" height="40" rx="6" fill="#2C3E50" />
  <text x="810" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
    fill="#9146FF" text-anchor="middle">TWITCH</text>
</svg>