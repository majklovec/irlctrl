<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="name" content="overlay.tpl.countdown" />
    <style>
      :root {
        --accent: #6c5ce7;
        --bg: rgba(15, 15, 25, 0.92);
        --text: #ffffff;
        --radius: 12px;
        --padding: 14px;
      }

      *, *::before, *::after { box-sizing: border-box; }

      section {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      .card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: var(--padding);
        background: var(--bg);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 4px;
        background: var(--accent);
        box-shadow: 0 0 16px var(--accent);
        animation: countdown-glow 2.4s ease-in-out infinite;
      }

      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 40%, var(--accent) 0%, transparent 65%);
        opacity: 0.08;
        pointer-events: none;
      }

      .label, .time { position: relative; z-index: 1; }

      .label {
        color: var(--accent);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .time {
        color: var(--text);
        font-size: 64px;
        font-weight: 800;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 24px var(--accent);
      }

      @keyframes countdown-glow {
        0%, 100% { opacity: 0.7; }
        50%      { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <section>
      <div class="card">
        <div class="label" data-bind="title">Starting in</div>
        <div class="time" data-countdown data-format="hh:mm:ss">00:00:00</div>
      </div>
    </section>
  </body>
</html>
